services:
  - type: web
    name: rasayam-website
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DEBUG
        value: "False"
      - key: STRICT_PRODUCTION_ENV
        value: "True"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false          # Set in Render dashboard after service URL is known
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: DATABASE_URL
        sync: false          # Set from Render Postgres add-on
      - key: REDIS_URL
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_STATIC_BUCKET_NAME
        sync: false
      - key: AWS_S3_REGION_NAME
        value: "ap-south-1"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RUN_MIGRATIONS_ON_STARTUP
        value: "true"        # Render runs a single container — startup migrate is acceptable
