upstream gunicorn {
    server web:8000;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name rasayam.com www.rasayam.com;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — main server block
server {
    listen 443 ssl;
    server_name rasayam.com www.rasayam.com;

    # ── Let's Encrypt certificate paths (replace with your domain) ──────────
    ssl_certificate     /etc/letsencrypt/live/rasayam.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rasayam.com/privkey.pem;
    # ────────────────────────────────────────────────────────────────────────

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 20M;

    # Serve Django static files directly from the shared volume
    location /static/ {
        alias /app/staticfiles/;
        expires 1d;
        add_header Cache-Control "public";
    }

    # Forward everything else to Gunicorn
    location / {
        proxy_pass         http://gunicorn;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
